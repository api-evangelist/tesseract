name: Tesseract
description: >-
  Tesseract is a Finnish digital-asset management and crypto-lending company.
  Tesseract Investment Oy is authorised as a Crypto-Asset Service Provider (CASP)
  under Regulation (EU) 2023/1114 (MiCA) and supervised by the Finnish Financial
  Supervisory Authority (FIN-FSA). It operates institutional-grade, per-client
  on-chain Dedicated Client Vaults (DCVs) on Ethereum mainnet, an Earn API that
  lets exchanges, neobanks and fintechs offer crypto yield to their users under
  their own brand, and Earn Direct for referred clients. Developers integrate via
  a public vault reporting API (unauthenticated reads, EIP-712 signed strategy
  assignment) and a partner Earn API using OAuth2 client-credentials with a daily
  net-settlement model.
