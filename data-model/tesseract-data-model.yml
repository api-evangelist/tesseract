earn_api_model:
  note: >-
    The partner Earn API (separate surface) uses a User -> Account -> Transaction
    hierarchy. A partner reference DBML schema (delivered under NDA) includes
    tesseract_product_types, tesseract_products, partner_users, tesseract_users
    (two Tesseract user IDs per partner user, one per credential set),
    tesseract_user_accounts (per-product/per-currency), tesseract_user_account_transactions,
    tesseract_wallets, and tesseract_reports_processed.
  source: https://docs.tesseract.fi/earn-direct-and-earn-api/earn-api/data-model-mapping.md
