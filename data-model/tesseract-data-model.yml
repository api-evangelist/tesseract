entities:
  - name: Client
    id: clientAddress
    id_format: ethereum-address (0x-prefixed 20-byte hex)
    description: A client (depositor) wallet address that owns one or more vaults.
    schema: ClientSummaryModel
  - name: Vault
    id: address
    id_format: ethereum-address
    description: >-
      A per-client on-chain vault contract on Ethereum mainnet holding a single
      ERC-20 asset and issuing non-transferable share tokens. No pooling across
      clients.
    schema: PublicVaultModel
  - name: Strategy
    id: id
    id_format: uuid
    description: A yield strategy that can be assigned to a vault (e.g. Conservative USDC).
    schema: StrategyModel
  - name: VaultTransaction
    id: hash
    id_format: ethereum-tx-hash
    description: A vault event (deploy, deposit, withdraw, execute, withdraw_request, release_funds, target_closed).
    schema: VaultTransactionModel
  - name: Allocation
    description: Point-in-time / historical allocation breakdown for a vault.
    schema: [AllocationHistoryModel, AllocationLatestModel]
  - name: Performance
    description: APY/APR, TVL and share-price time-series for a vault.
    schema: [PerformanceHistoryModel, TvlHistoryModel, SummaryModel]
